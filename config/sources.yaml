# Only these named database tables can be requested. The connection string is
# read from the named environment variable; no SQL or credentials enter the API.
database_tables:
  orders_table_demo:
    connection_env: P2_SOURCE_DATABASE_URL
    schema: public
    table: p2_orders_snapshot
    order_key: order_id
    contract_name: default
    family: orders_table_demo
    row_cap: 5000
    byte_cap: 10485760
    statement_timeout_ms: 10000

# Local JSON is selected by ID; the path and normalization policy are server
# config only. Arrays in records other than the top-level records list fail.
local_json:
  orders_json_demo:
    file: day10_nested_orders.json
    records_path: payload.orders
    contract_name: default
    family: orders_current
    row_cap: 5000
    byte_cap: 1048576
    max_depth: 3
    separator: "_"
