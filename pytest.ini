[pytest]
# backend/ uses bare top-level imports (`graph.state`, `pipeline.contract`,
# `services.store`, ...) that only resolve if backend/ itself is on
# sys.path -- this is what makes `import graph.routing` work from tests/
# without duplicating backend's own package layout. conftest.py adds the
# same path defensively for anyone invoking pytest from an unusual cwd.
pythonpath = backend

testpaths = tests

# asyncio_mode=auto: most node/router-adjacent functions under test are
# `async def` (every graph node, chat_context's builders, the analytics
# aggregators) -- auto mode lets a plain `async def test_...` work without
# decorating every single one with @pytest.mark.asyncio.
asyncio_mode = auto

# --strict-markers: a typo'd marker (@pytest.mark.slwo) fails collection
# instead of silently registering a new marker that never runs anything --
# every marker actually used by this suite must be declared below.
#
# Coverage is scoped to graph/, pipeline/, and services/analytics.py only --
# the modules this suite's structure is actually designed to exercise.
# services/llm.py, services/store.py, and services/checkpointer.py are
# deliberately excluded: the first is untestable without asserting model
# behavior (see README's "LLM node behaviour is not unit-tested"), the other
# two are pure Postgres I/O this suite has no connection to reach.
addopts = --strict-markers -ra
    --cov=graph
    --cov=pipeline
    --cov=services.analytics
    --cov-report=term-missing

markers =
    unit: pure-function / single-module logic, no I/O, no graph execution.
    integration: multiple real modules together (pandas+pandera over a real
        fault CSV, or a compiled stub graph actually executing a topology).
    slow: reserved for a test whose runtime is disproportionate to the rest
        of the suite; none currently qualifies at this suite's size.
