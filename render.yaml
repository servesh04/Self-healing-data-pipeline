# Render blueprint. Optional — the same service can be created through the
# dashboard. Committed so the deployment is reproducible rather than a set of
# remembered clicks.
#
# Secrets are marked sync:false: Render prompts for them instead of reading
# them from this file, so DATABASE_URL and SHARED_TOKEN never enter git.
services:
  - type: web
    name: shp-backend
    runtime: docker
    plan: free
    region: ohio                     # same region as the Neon project (us-east-2)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health         # unauthenticated and DB-free by design
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SHARED_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: render
