# Render blueprint. Optional — the same service can be created through the
# dashboard. Committed so the deployment is reproducible rather than a set of
# remembered clicks.
#
# Secrets are marked sync:false: Render prompts for them instead of reading
# them from this file, so DATABASE_URL and SHARED_TOKEN never enter git.
services:
  - type: web
    name: shp-backend
    runtime: docker
    plan: free
    region: ohio                     # same region as the Neon project (us-east-2)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health         # unauthenticated and DB-free by design
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SHARED_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: render
      - key: GROQ_API_KEY
        sync: false
      # Dashboard demo namespace (DASHBOARD.md Step 0) — isolates seeded/demo
      # run history from the 'default' namespace other verification scripts
      # assume is untouched. Not a secret, so no sync:false.
      - key: PIPELINE_ENV
        value: dashboard-demo
